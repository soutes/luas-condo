
# Host port bindings are loopback-only by default so the stacks sharing the VM
# never conflict and nothing is exposed directly. Public traffic must go through
# the shared Caddy via the external `web` network (docs/vm-port-allocation-runbook.md).
services:
  db:
    image: postgres:16-alpine
    container_name: luas_condo_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-luas_condo}
    ports:
      - "${POSTGRES_HOST_IP:-127.0.0.1}:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 45s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: luas_condo_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_HOST_IP:-127.0.0.1}:${BACKEND_HOST_PORT:-8000}:8000"
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-luas_condo}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-luas_condo}
      MOCK_BITRIX_URL: http://mock-bitrix:8080
      MOCK_SUBMISSION: ${MOCK_SUBMISSION:-true}
      CONDO_PDF_PASSWORD: ${CONDO_PDF_PASSWORD:-04293}
      SYNDKOS_EMAIL_SENDER: ${SYNDKOS_EMAIL_SENDER:-naoresponda@syndkos.com.br}
      IMAP_SERVER: ${IMAP_SERVER:-imap.gmail.com}
      IMAP_PORT: ${IMAP_PORT:-993}
      IMAP_USER: ${IMAP_USER:-}
      IMAP_PASSWORD: ${IMAP_PASSWORD:-}
      IMAP_READ_ONLY: ${IMAP_READ_ONLY:-true}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - luas_condo_storage:/data/storage
    networks:
      - default
      - web


  mock-bitrix:
    build:
      context: ./mock_bitrix
      dockerfile: Dockerfile
    container_name: luas_condo_mock_bitrix
    restart: unless-stopped
    ports:
      - "${MOCK_BITRIX_HOST_IP:-127.0.0.1}:${MOCK_BITRIX_HOST_PORT:-8080}:8080"
    volumes:
      - ./mock_bitrix:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: luas_condo_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_HOST_IP:-127.0.0.1}:${FRONTEND_HOST_PORT:-5173}:5173"
    environment:
      VITE_API_URL: http://backend:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - default
      - web

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: luas_condo_prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_HOST_IP:-127.0.0.1}:${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:10.4.1
    container_name: luas_condo_grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_HOST_IP:-127.0.0.1}:${GRAFANA_HOST_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    depends_on:
      - prometheus

volumes:
  pgdata:
  luas_condo_storage:

networks:
  default:
  web:
    external: true

