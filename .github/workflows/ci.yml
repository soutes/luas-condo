name: CI/CD Pipeline

'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: Target deployment environment
        required: true
        default: production
        type: choice
        options:
          - production
          - dev
      rollback:
        description: Rollback to previous stable version
        required: false
        default: false
        type: boolean
      rollback_commit:
        description: Commit SHA or image tag to roll back to
        required: false
        default: ""
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio anyio httpx

      - name: Install Playwright Browsers
        run: |
          python -m playwright install --with-deps chromium

      - name: Run Backend Pytest Suite
        env:
          STORAGE_DIR: ${{ runner.temp }}/storage
        run: |
          pytest --maxfail=1 -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: |
          npm ci

      - name: Run Frontend Vitest Suite
        working-directory: ./frontend
        run: |
          npm test

      - name: Build Frontend Production Bundle
        working-directory: ./frontend
        run: |
          npm run build

  deploy-dev:
    name: Automated Deploy to Dev
    needs: test
    if: >-
      (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev')
    environment: development
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-vm
      cancel-in-progress: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to VM over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_TARGET: ${{ github.event.inputs.rollback == 'true' && github.event.inputs.rollback_commit || github.sha }}
        run: bash deploy/ci-deploy.sh

  deploy-prod:
    name: Manual Deploy to Production
    needs: test
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'
    environment: production
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-vm
      cancel-in-progress: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Deployment Mode
        env:
          ROLLBACK: ${{ github.event.inputs.rollback }}
          ROLLBACK_COMMIT: ${{ github.event.inputs.rollback_commit }}
        run: |
          if [ "$ROLLBACK" = "true" ]; then
            if [ -z "$ROLLBACK_COMMIT" ]; then
              echo "rollback_commit is required when rollback is enabled" >&2
              exit 1
            fi
            echo "ROLLBACK MODE: target $ROLLBACK_COMMIT"
          else
            echo "STANDARD PRODUCTION DEPLOYMENT: target $GITHUB_SHA"
          fi

      - name: Execute Production Deployment or Rollback over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_TARGET: ${{ github.event.inputs.rollback == 'true' && github.event.inputs.rollback_commit || github.sha }}
        run: bash deploy/ci-deploy.sh

      - name: Verify public health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS -m 15 https://condo.147-15-76-139.sslip.io/api/health; then exit 0; fi
            sleep 10
          done
          echo "Public health check failed" >&2
          exit 1
