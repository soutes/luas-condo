services:
  db:
    image: postgres:16-alpine
    container_name: luas_condo_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-luas_condo}
    volumes:
      - luas_condo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-luas_condo}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 96M
    networks:
      - luas_condo_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: luas_condo_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-luas_condo}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-luas_condo}
      MOCK_SUBMISSION: ${MOCK_SUBMISSION:-false}
      IBAGY_BITRIX_URL: ${IBAGY_BITRIX_URL:-https://ibagy.bitrix24.site/condominioressarcimento/ressarcimento/}
      CONTRATO_PADRAO: ${CONTRATO_PADRAO:-09638.003.03}
      CONDO_PDF_PASSWORD: ${CONDO_PDF_PASSWORD:-04293}
      SYNDKOS_EMAIL_SENDER: ${SYNDKOS_EMAIL_SENDER:-naoresponda@syndkos.com.br}
      IMAP_SERVER: ${IMAP_SERVER:-imap.gmail.com}
      IMAP_PORT: ${IMAP_PORT:-993}
      IMAP_USER: ${IMAP_USER:-}
      IMAP_PASSWORD: ${IMAP_PASSWORD:-}
      IMAP_READ_ONLY: ${IMAP_READ_ONLY:-true}
      AUTO_SUBMIT: ${AUTO_SUBMIT:-true}
      POLL_WINDOW_START_DAY: ${POLL_WINDOW_START_DAY:-7}
      POLL_WINDOW_END_DAY: ${POLL_WINDOW_END_DAY:-12}
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production}
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 200M
    networks:
      - luas_condo_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: luas_condo_frontend
    restart: unless-stopped
    ports:
      - "3080:80"
    deploy:
      resources:
        limits:
          memory: 32M
    networks:
      - luas_condo_network

volumes:
  luas_condo_pgdata:

networks:
  luas_condo_network:
    driver: bridge
