[project]
name = "luas-condo-backend"
version = "0.1.0"
description = "Condo Audit & Reimbursement System Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy>=2.0.29",
    "pydantic>=2.7.0",
    "pdfplumber>=0.11.0",
    "PyMuPDF>=1.24.0",
    "playwright>=1.43.0",
    "opentelemetry-api>=1.24.0",
    "prometheus-client>=0.20.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = [
    "ignore::DeprecationWarning:websockets.*:",
]
