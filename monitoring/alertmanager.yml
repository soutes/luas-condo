# Routes every alert to the On-Call Responder agent (backend webhook).
# The bearer token is read from /tmp/alert_webhook_token, written at container
# start-up from ALERT_WEBHOOK_TOKEN (see docker-compose.yml).
route:
  receiver: oncall-agent
  group_by: [alertname]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h

receivers:
  - name: oncall-agent
    webhook_configs:
      - url: http://backend:8000/api/alerts/webhook
        send_resolved: false
        http_config:
          authorization:
            type: Bearer
            credentials_file: /tmp/alert_webhook_token
